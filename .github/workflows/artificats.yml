name: Artifacts Demo

on:
  workflow_dispatch:

jobs:
  flask-ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: flask-app:v1.0.1

      - name: Run Container
        run: |
          docker run -d \
            -p 5000:5000 \
            --name flask-container \
            flask-app:v1.0.1

      - name: Smoke test
        run: |
         sleep 5
         curl http://localhost:5000 > smoke-report.txt
         curl http://localhost:5000/health >> smoke-report.txt

      - name: Container logs
        run: |
         docker logs flask-container > container-logs.txt

      - name: Upload Artifat
        uses: echapmanFromBunnings/upload-artifact@3.0
        with:
         name: 'flask-ci-artifacts'
         path: |
           smoke-report.txt
           container-logs.txt
         retention-days: 10 

  review-jobs:
    runs-on: ubuntu-latest
    needs: flask-ci-job

    steps:
        - name: Download Artifacts
          uses: actions/download-artifact@v8
          with:
           name: flask-ci-artifacts

        - name: Review Downloaded Artifacts
          run: |
           echo "===== Smoke Test Report ====="
           cat smoke-remote-report.txt

           echo ""
           echo "===== Container Logs ====="
           cat container-logs.txt
    

